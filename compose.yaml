# MicroHydros backend. One file for local development and for servers.
# Everything that differs between machines (ports, bind addresses, logins) comes from .env.
# Defaults match the original local setup: 1883 / 1880 / 8086 / 3000 on all interfaces.
#
#   cp .env.example .env   # then edit it
#   ./scripts/deploy.sh
#   ./scripts/smoke-test.sh
#
# The running Hetzner server still uses docker/compose.hetzner.yaml, which is unchanged.
# The project name prefixes container, volume and network names. Set COMPOSE_PROJECT_NAME in .env
# to run a second copy next to another stack on the same host.
name: microhydros

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${COMPOSE_PROJECT_NAME:-microhydros}-mosquitto
    ports:
      - "${MQTT_BIND:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - microhydros-network
    restart: unless-stopped
    mem_limit: ${MOSQUITTO_MEM:-128m}

  node-red:
    image: nodered/node-red:5.0.7
    container_name: ${COMPOSE_PROJECT_NAME:-microhydros}-node-red
    # First start only: copy the seed flows (validation + storage) into an empty /data volume.
    # After that the flows in the volume are used, so edits made in the editor are kept.
    entrypoint: ["/bin/sh", "-c", "[ -f /data/flows.json ] || cp /seed/flows.json /data/flows.json; exec ./entrypoint.sh"]
    ports:
      - "${NODERED_BIND:-0.0.0.0}:${NODERED_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data
      - ./docker/node-red/settings.js:/data/settings.js:ro
      - ./docker/node-red/seed:/seed:ro
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      NODERED_ADMIN_USER: ${NODERED_ADMIN_USER:-admin}
      NODERED_ADMIN_HASH: ${NODERED_ADMIN_HASH:-}
      NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET:-}
      TZ: ${TZ:-UTC}
    networks:
      - microhydros-network
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped
    mem_limit: ${NODERED_MEM:-512m}

  influxdb:
    image: influxdb:2.9.1
    container_name: ${COMPOSE_PROJECT_NAME:-microhydros}-influxdb
    ports:
      - "${INFLUX_BIND:-0.0.0.0}:${INFLUX_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - microhydros-network
    restart: unless-stopped
    mem_limit: ${INFLUX_MEM:-1g}

  grafana:
    image: grafana/grafana:13.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-microhydros}-grafana
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - microhydros-network
    depends_on:
      - influxdb
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM:-512m}

networks:
  microhydros-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  node_red_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
